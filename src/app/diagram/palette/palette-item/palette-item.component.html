<div class="palette-item">
  <div class="palette-item__icon">
    <app-palette-item-icon [iconType]="entry().iconType" />
  </div>
  <div class="palette-item__text">
    <div class="palette-item__label">{{ entry().label }}</div>
    <div class="palette-item__subtitle">{{ entry().subtitle }}</div>
  </div>
</div>
