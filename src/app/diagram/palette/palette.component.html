<app-sidebar [title]="'Components'">
  <div class="palette-search">
    <svg viewBox="0 0 16 16" class="palette-search__icon">
      <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
      <line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <input
      type="text"
      class="palette-search__input"
      placeholder="Search components"
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
    />
  </div>

  <div class="palette__sections">
    @for (section of sections(); track section.category) {
      <section class="palette-section">
        <h3 class="palette-section__title">{{ section.title }}</h3>
        <div class="palette-section__items">
          @for (entry of section.items; track entry.key) {
            <ng-diagram-palette-item [item]="entry.ngItem">
              <app-palette-item [entry]="entry" />
              <ng-diagram-palette-item-preview>
                <app-palette-item-preview [entry]="entry" />
              </ng-diagram-palette-item-preview>
            </ng-diagram-palette-item>
          }
        </div>
      </section>
    }
    @if (sections().length === 0) {
      <p class="palette__empty">No components match "{{ query() }}".</p>
    }
  </div>
</app-sidebar>
