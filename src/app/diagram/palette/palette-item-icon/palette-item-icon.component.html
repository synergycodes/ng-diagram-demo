<svg viewBox="0 0 24 24" class="icon" preserveAspectRatio="xMidYMid meet">
  @switch (iconType()) {
    @case ('resistor') {
      <line x1="2" y1="12" x2="6" y2="12" />
      <polyline points="6,12 8,8 11,16 14,8 17,16 19,12 22,12" />
    }
    @case ('capacitor') {
      <line x1="2" y1="12" x2="11" y2="12" />
      <line x1="11" y1="6" x2="11" y2="18" />
      <line x1="13" y1="6" x2="13" y2="18" />
      <line x1="13" y1="12" x2="22" y2="12" />
    }
    @case ('diode') {
      <line x1="2" y1="12" x2="9" y2="12" />
      <polygon points="9,7 9,17 17,12" fill="currentColor" />
      <line x1="17" y1="7" x2="17" y2="17" />
      <line x1="17" y1="12" x2="22" y2="12" />
    }
    @case ('led') {
      <line x1="2" y1="14" x2="8" y2="14" />
      <polygon points="8,9 8,19 16,14" fill="currentColor" />
      <line x1="16" y1="9" x2="16" y2="19" />
      <line x1="16" y1="14" x2="22" y2="14" />
      <line x1="14" y1="7" x2="18" y2="3" />
      <polyline points="16,3 18,3 18,5" />
      <line x1="17" y1="7" x2="21" y2="3" />
      <polyline points="19,3 21,3 21,5" />
    }
    @case ('battery') {
      <line x1="2" y1="12" x2="9" y2="12" />
      <line x1="9" y1="6" x2="9" y2="18" />
      <line x1="13" y1="9" x2="13" y2="15" />
      <line x1="13" y1="12" x2="22" y2="12" />
    }
    @case ('gnd') {
      <line x1="12" y1="3" x2="12" y2="11" />
      <line x1="5" y1="11" x2="19" y2="11" />
      <line x1="8" y1="15" x2="16" y2="15" />
      <line x1="11" y1="19" x2="13" y2="19" />
    }
    @case ('vcc') {
      <polygon points="12,3 5,11 19,11" fill="currentColor" />
      <line x1="12" y1="11" x2="12" y2="21" />
    }
    @case ('ic') {
      <rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" />
      <circle cx="8" cy="8" r="0.8" fill="currentColor" />
      <line x1="3" y1="9" x2="6" y2="9" />
      <line x1="3" y1="12" x2="6" y2="12" />
      <line x1="3" y1="15" x2="6" y2="15" />
      <line x1="18" y1="9" x2="21" y2="9" />
      <line x1="18" y1="12" x2="21" y2="12" />
      <line x1="18" y1="15" x2="21" y2="15" />
    }
    @case ('board') {
      <rect x="3" y="5" width="18" height="14" rx="2" fill="none" />
      <circle cx="6" cy="9" r="0.7" fill="currentColor" />
      <circle cx="6" cy="12" r="0.7" fill="currentColor" />
      <circle cx="6" cy="15" r="0.7" fill="currentColor" />
      <circle cx="18" cy="9" r="0.7" fill="currentColor" />
      <circle cx="18" cy="12" r="0.7" fill="currentColor" />
      <circle cx="18" cy="15" r="0.7" fill="currentColor" />
      <rect x="9" y="9" width="6" height="6" rx="0.5" fill="currentColor" />
    }
  }
</svg>
